target:
  baseUrl: http://localhost:8080

mix:
  endpoints:
    - name: primary
      weight: 70
      method: POST
      path: /endpoint-a
      headers:
        Content-Type: application/json
      bodyTemplateFile: ./examples/templates/endpoint-a.json
    - name: secondary
      weight: 30
      method: POST
      path: /endpoint-b
      headers:
        Content-Type: application/json
      bodyTemplateFile: ./examples/templates/endpoint-b.json

search:
  startRps: 5
  maxRps: 120
  resolutionRps: 1
  duration: 30s
  warmupDuration: 10s
  cooldownSeconds: 10

sla:
  maxErrorRate: 0.01
  p95Ms: 500
  p99Ms: 2000
  minAchievedRatio: 0.95

k6:
  preAllocatedVUs: 50
  maxVUs: 300

runtime:
  mode: auto
  dockerImage: grafana/k6:latest

health:
  url: null
  intervalSeconds: 5
  timeoutSeconds: 120

bodyGenerators:
  orderId:
    type: uuid
    duplicateRate: 0.05
    reuseWindow: 100
  customerRef:
    type: random
    length: 12
    charset: alnum
    duplicateRate: 0.02
    reuseWindow: 100
  requestKey:
    type: sequence
    prefix: req-
    zeroPad: 8
    duplicateRate: 0.00
    reuseWindow: 100

results:
  outputDir: ./results
